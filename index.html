<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Micro-Project-1 — Send a File</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 420px;
      margin: 40px auto;
    }

    input,
    textarea,
    button {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Send a File to Gmail</h2>
  <form id="sendForm">
    <input type="email" id="receiver" placeholder="Receiver Gmail address" required />
    <input type="text" id="subject" placeholder="Subject" required />
    <textarea id="body" placeholder="Body" rows="4"></textarea>
    <input type="file" id="file" required />
    <button type="submit">Send</button>
  </form>
  <p id="status"></p>

  <script>
    // TODO: fill these in from your Supabase project settings (Settings > API)
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY"; // safe to expose, it's the public key

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50MB

    document.getElementById('sendForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const status = document.getElementById('status');
      const file = document.getElementById('file').files[0];

      if (file.size > MAX_FILE_SIZE) {
        status.textContent = 'File too large (max 50MB).';
        return;
      }

      status.textContent = 'Uploading file...';
      const filePath = `${Date.now()}_${file.name}`;

      const { error: uploadError } = await supabaseClient.storage
        .from('uploads')
        .upload(filePath, file);

      if (uploadError) {
        status.textContent = 'Upload failed: ' + uploadError.message;
        return;
      }

      status.textContent = 'Sending email...';

      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            receiver: document.getElementById('receiver').value,
            subject: document.getElementById('subject').value,
            body: document.getElementById('body').value,
            filePath,
          }),
        });

        const result = await res.json();
        status.textContent = res.ok ? 'Email sent!' : 'Error: ' + result.error;
      } catch (err) {
        status.textContent = 'Network error: ' + err.message;
      }
    });
  </script>
</body>

</html>
