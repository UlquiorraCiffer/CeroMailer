<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Micro-Project-1 — Send a File</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 420px;
      margin: 40px auto;
    }

    input,
    textarea,
    button {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Send a File to Gmail</h2>
  <form id="sendForm">
    <input type="email" id="receiver" placeholder="Receiver Gmail address" required />
    <input type="text" id="subject" placeholder="Subject" required />
    <textarea id="body" placeholder="Body" rows="4"></textarea>
    <input type="file" id="file" multiple />
    <button type="submit" id="submitBtn">Send</button>
  </form>
  <p id="status"></p>

  <script>
    // Supabase project credentials
    const SUPABASE_URL = "https://euduprorskqxcvecapfo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gxIe1B6z1ZGKecBOksly4w_H9nw1xFq"; // safe to expose, it's the public key

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50MB

    function sanitizeFileName(name) {
      return name.replace(/[^a-zA-Z0-9._-]/g, '_');
    }

    document.getElementById('sendForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const files = document.getElementById('file').files;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        // Validate per-file size
        for (const file of files) {
          if (file.size > MAX_FILE_SIZE) {
            status.textContent = `File "${file.name}" is too large (max 50MB).`;
            return;
          }
        }

        // Step 1: Request server-issued upload session
        status.textContent = 'Creating upload session...';
        const sessionRes = await fetch('/api/create-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        });

        if (!sessionRes.ok) {
          const sessionErr = await sessionRes.json().catch(() => ({}));
          status.textContent = 'Session creation failed: ' + (sessionErr.error || sessionRes.statusText);
          return;
        }

        const sessionData = await sessionRes.json();
        const sessionId = sessionData.sessionId;

        // Step 2: Upload files under sessions/<sessionId>/<sanitized-original-filename>
        if (files.length > 0) {
          status.textContent = `Uploading ${files.length} file(s)...`;
          for (const file of files) {
            const safeName = sanitizeFileName(file.name);
            const remotePath = `sessions/${sessionId}/${safeName}`;
            const { error: uploadError } = await supabaseClient.storage
              .from('uploads')
              .upload(remotePath, file);

            if (uploadError) {
              status.textContent = 'Upload failed: ' + uploadError.message;
              return;
            }
          }
        }

        // Step 3: Send email with session ID only
        status.textContent = 'Sending email...';

        const res = await fetch('/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            receiver: document.getElementById('receiver').value,
            subject: document.getElementById('subject').value,
            body: document.getElementById('body').value,
          }),
        });

        const result = await res.json();
        status.textContent = res.ok ? 'Email sent!' : 'Error: ' + (result.error || 'Failed to send');
      } catch (err) {
        status.textContent = 'Network error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send';
      }
    });
  </script>
</body>

</html>
